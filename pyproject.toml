[project]
name = "car-dealer-agent"
version = "0.1.0"
description = "Real-time AI voice agent for car dealership — RAG + calendar + voice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic-settings>=2.3.0",
    # Agent framework
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.0",
    # LLM
    "langchain-groq>=0.2.0",
    "groq>=0.9.0",
    # Embeddings — HuggingFace sentence-transformers (BAAI/bge-small-en-v1.5)
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    # Vector store
    "chromadb>=0.5.0",
    "pinecone-client>=4.0.0",
    # STT
    "deepgram-sdk>=3.5.0",
    # TTS
    "cartesia>=1.0.0",
    # Call transport
    "livekit>=0.17.0",
    "livekit-api>=0.7.0",
    "twilio>=9.0.0",
    # Google Calendar
    "google-api-python-client>=2.140.0",
    "google-auth>=2.32.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    # Email
    "sendgrid>=6.11.0",
    # Scheduler
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
    # Data
    "pandas>=2.2.0",
    "kaggle>=2.2.0",
    # Logging
    "structlog>=24.0.0",
    "livekit-agents>=1.5.15",
    "livekit-plugins-deepgram>=1.5.15",
    "livekit-plugins-cartesia>=1.5.15",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "voice", "rag", "tools", "scheduler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
